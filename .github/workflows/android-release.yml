name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-app/frontend-vue

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa-app/backend/package-lock.json
            qa-app/frontend-vue/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install project dependencies
        working-directory: .
        run: npm run setup

      - name: Project checks
        working-directory: .
        run: npm run check

      - name: Build Android APK
        run: |
          npm run android:sync
          cd android
          ./gradlew assembleDebug

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "VFriend-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "VFriend-$GITHUB_REF_NAME.apk" --generate-notes --title "VFriend $GITHUB_REF_NAME"
