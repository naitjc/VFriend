name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/server/package-lock.json
            apps/client/package-lock.json
      - run: npm run setup
      - run: npm run check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm --prefix apps/client ci
      - run: npm --prefix apps/client run android:sync
      - run: ./gradlew assembleDebug assembleParallel
        working-directory: apps/client/android
